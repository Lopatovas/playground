name: CommitLoop Deploy

on:
  push:
    branches: [main]
    paths:
      - "commitloop/**"
      - ".github/workflows/commitloop-ci-reusable.yml"
      - ".github/workflows/commitloop-deploy.yml"
  workflow_dispatch:

concurrency:
  group: commitloop-deploy-production
  cancel-in-progress: true

jobs:
  ci:
    uses: ./.github/workflows/commitloop-ci-reusable.yml

  deploy-api:
    name: Deploy API (Render)
    needs: ci
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Trigger Render deploy
        run: curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"

      - name: Wait for API health
        run: |
          for attempt in $(seq 1 36); do
            if curl -fsS https://api.commitloop.dev/health; then
              echo "API is healthy"
              exit 0
            fi
            echo "Waiting for API (attempt ${attempt}/36)..."
            sleep 10
          done
          echo "API health check timed out"
          exit 1

  deploy-web:
    name: Deploy Web (Vercel)
    needs: ci
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: commitloop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: commitloop/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Pull Vercel environment
        working-directory: web
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Build for production
        working-directory: web
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploy to Vercel
        working-directory: web
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
