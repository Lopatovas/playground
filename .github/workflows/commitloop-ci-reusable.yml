name: CommitLoop CI (reusable)

on:
  workflow_call:

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: commitloop
          POSTGRES_PASSWORD: commitloop
          POSTGRES_DB: commitloop
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U commitloop -d commitloop"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: commitloop

    env:
      DATABASE_URL: postgresql://commitloop:commitloop@localhost:5432/commitloop

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: commitloop/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate -w @commitloop/api

      - name: Apply database migrations
        run: npm run db:migrate:deploy -w @commitloop/api

      - name: Clean stale Next.js types
        run: rm -rf web/.next

      - name: Architecture gates
        run: npm run arch:check

      - name: Content validation
        run: npm run content:check

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test with coverage
        run: npm run test:coverage

      - name: Build
        run: npm run build
