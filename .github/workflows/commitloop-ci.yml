name: CommitLoop CI

on:
  push:
    paths:
      - "commitloop/**"
      - ".github/workflows/commitloop-ci.yml"
  pull_request:
    paths:
      - "commitloop/**"
      - ".github/workflows/commitloop-ci.yml"

defaults:
  run:
    working-directory: commitloop

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: commitloop/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate -w @commitloop/api

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test with coverage
        run: npm run test:coverage
        env:
          DATABASE_URL: file:./test.db

      - name: Build
        run: npm run build
