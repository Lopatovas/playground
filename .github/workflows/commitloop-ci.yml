name: CommitLoop CI

on:
  push:
    paths:
      - "commitloop/**"
      - ".github/workflows/commitloop-ci.yml"
      - ".github/workflows/commitloop-ci-reusable.yml"
  pull_request:
    paths:
      - "commitloop/**"
      - ".github/workflows/commitloop-ci.yml"
      - ".github/workflows/commitloop-ci-reusable.yml"

jobs:
  ci:
    uses: ./.github/workflows/commitloop-ci-reusable.yml
