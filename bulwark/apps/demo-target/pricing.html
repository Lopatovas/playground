<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bulwark · Pricing</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
    <link rel="stylesheet" href="/fixtures.css" />
  </head>
  <body class="page-pricing __PAGE_CLASSES__">
    <main class="scene scene--pricing" aria-label="Pricing fixture, __PAGE_VARIANT__ variant">
      <p id="defect-summary" class="sr-only">__DEFECT_SUMMARY__</p>

      <h1 class="pr-title">Plans that pop</h1>
      <p class="pr-sub">Pick a tier. Colors are the product.</p>

      <article class="pr-card pr-card--starter">
        <h2 class="pr-card-name">Starter</h2>
        <p class="pr-price pr-price--starter">$12</p>
        <p class="pr-period">per seat</p>
        <a class="pr-cta pr-cta--starter" href="#starter">Choose</a>
      </article>

      <article class="pr-card pr-card--pro">
        <span class="pr-pill">Most popular</span>
        <h2 class="pr-card-name">Pro</h2>
        <p class="pr-price pr-price--pro">$48</p>
        <p class="pr-period">per seat</p>
        <a class="pr-cta pr-cta--pro" href="#pro">Choose</a>
      </article>

      <article class="pr-card pr-card--scale">
        <h2 class="pr-card-name">Scale</h2>
        <p class="pr-price pr-price--scale">$96</p>
        <p class="pr-period">per seat</p>
        <a class="pr-cta pr-cta--scale" href="#scale">Choose</a>
      </article>
    </main>
  </body>
</html>
