<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bulwark · Fintech</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
    <link rel="stylesheet" href="/fixtures.css" />
  </head>
  <body class="page-fintech __PAGE_CLASSES__">
    <main class="scene scene--fintech" aria-label="Fintech fixture, __PAGE_VARIANT__ variant">
      <p id="defect-summary" class="sr-only">__DEFECT_SUMMARY__</p>

      <span class="ft-brand">Ledgerly</span>
      <h1 class="ft-balance">$12,480.20</h1>
      <p class="ft-label">Available</p>

      <article class="ft-card ft-card--spend">
        <h2 class="ft-card-title">Spending</h2>
        <p class="ft-card-value ft-card-value--down">−$312</p>
      </article>
      <article class="ft-card ft-card--save">
        <h2 class="ft-card-title">Saved</h2>
        <p class="ft-card-value ft-card-value--up">+$890</p>
      </article>

      <a class="ft-cta" href="#send">Send money</a>
      <a class="ft-link" href="#activity">Activity</a>
      <p class="ft-alert">2 pending transfers</p>
    </main>
  </body>
</html>
