<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bulwark Complex Demo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body class="page-complex __PAGE_CLASSES__">
    <main class="scene scene--complex" aria-label="Bulwark complex QA demo, __PAGE_VARIANT__ variant">
      <p id="defect-summary" class="sr-only">__DEFECT_SUMMARY__</p>

      <header class="cx-nav">
        <div class="cx-logo">NovaDesk</div>
        <nav class="cx-links" aria-label="Primary">
          <a class="cx-link" href="#overview">Overview</a>
          <a class="cx-link cx-link--mid" href="#projects">Projects</a>
          <a class="cx-link cx-link--end" href="#reports">Reports</a>
        </nav>
        <a class="cx-signin" href="#signin">Sign in</a>
      </header>

      <aside class="cx-sidebar" aria-label="Folders">
        <p class="cx-side-title">Folders</p>
        <a class="cx-side-item cx-side-item--1" href="#inbox">Inbox</a>
        <a class="cx-side-item cx-side-item--2" href="#shared">Shared</a>
        <a class="cx-side-item cx-side-item--3" href="#archive">Archive</a>
      </aside>

      <section class="cx-main">
        <h1 class="cx-heading">Sprint board</h1>
        <p class="cx-subtitle">Track delivery across design and engineering</p>

        <div class="cx-cards">
          <article class="cx-card cx-card--1">
            <h2 class="cx-card-title">Design</h2>
            <p class="cx-card-meta">12 open</p>
          </article>
          <article class="cx-card cx-card--2">
            <h2 class="cx-card-title">Build</h2>
            <p class="cx-card-meta">8 open</p>
          </article>
          <article class="cx-card cx-card--3">
            <h2 class="cx-card-title">QA</h2>
            <p class="cx-card-meta">5 open</p>
          </article>
        </div>

        <div class="cx-panel">
          <div class="cx-row cx-row--head">
            <span class="cx-cell">Task</span>
            <span class="cx-cell">Owner</span>
            <span class="cx-cell">Status</span>
          </div>
          <div class="cx-row cx-row--1">
            <span class="cx-cell">Overlay polish</span>
            <span class="cx-cell">Mira</span>
            <span class="cx-cell">Review</span>
          </div>
          <div class="cx-row cx-row--2">
            <span class="cx-cell">Detector bridge</span>
            <span class="cx-cell">Jon</span>
            <span class="cx-cell">Active</span>
          </div>
        </div>

        <div class="cx-actions">
          <a class="cx-btn cx-btn--primary" href="#create">Create task</a>
          <a class="cx-btn cx-btn--secondary" href="#export">Export</a>
        </div>
      </section>
    </main>
  </body>
</html>
