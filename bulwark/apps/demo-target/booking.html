<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bulwark · Booking</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
    <link rel="stylesheet" href="/fixtures.css" />
  </head>
  <body class="page-booking __PAGE_CLASSES__">
    <main class="scene scene--booking" aria-label="Booking fixture, __PAGE_VARIANT__ variant">
      <p id="defect-summary" class="sr-only">__DEFECT_SUMMARY__</p>

      <span class="bk-brand">Northstay</span>
      <h1 class="bk-title">Harbor loft</h1>
      <p class="bk-place">Lisbon · 2 guests</p>
      <div class="bk-hero" aria-label="Stay photo"></div>

      <div class="bk-cal">
        <span class="bk-day bk-day--1">12</span>
        <span class="bk-day bk-day--2 bk-day--selected">13</span>
        <span class="bk-day bk-day--3 bk-day--range">14</span>
        <span class="bk-day bk-day--4">15</span>
      </div>

      <p class="bk-rate">$186 / night</p>
      <span class="bk-badge">Free cancel</span>
      <a class="bk-cta" href="#book">Reserve</a>
      <a class="bk-link" href="#map">View map</a>
    </main>
  </body>
</html>
