<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bulwark · E-shop PDP</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
    <link rel="stylesheet" href="/fixtures.css" />
  </head>
  <body class="page-eshop __PAGE_CLASSES__">
    <main class="scene scene--eshop" aria-label="E-shop PDP fixture, __PAGE_VARIANT__ variant">
      <p id="defect-summary" class="sr-only">__DEFECT_SUMMARY__</p>

      <div class="es-nav">
        <span class="es-brand">FieldGoods</span>
        <a class="es-navlink es-navlink--1" href="#shop">Shop</a>
        <a class="es-navlink es-navlink--2" href="#cart">Cart</a>
      </div>

      <div class="es-photo" aria-label="Product photo">
        <span class="es-sale-badge">Sale</span>
      </div>
      <div class="es-thumb es-thumb--1" aria-hidden="true"></div>
      <div class="es-thumb es-thumb--2" aria-hidden="true"></div>
      <div class="es-thumb es-thumb--3" aria-hidden="true"></div>

      <p class="es-collection">Trail gear</p>
      <h1 class="es-title">Ridge Pack 28L</h1>
      <p class="es-rating">★★★★☆ 128</p>
      <p class="es-price-was">$180</p>
      <p class="es-price-now">$129</p>
      <span class="es-save">Save 28%</span>

      <span class="es-swatch es-swatch--clay" title="Clay"></span>
      <span class="es-swatch es-swatch--pine" title="Pine"></span>
      <span class="es-swatch es-swatch--slate" title="Slate"></span>

      <a class="es-atc" href="#cart">Add to cart</a>
      <a class="es-wish" href="#wish">Wishlist</a>
      <p class="es-stock">In stock · ships today</p>
    </main>
  </body>
</html>
