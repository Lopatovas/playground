<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bulwark · Dashboard vivid</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
    <link rel="stylesheet" href="/fixtures.css" />
  </head>
  <body class="page-dashboard-vivid __PAGE_CLASSES__">
    <main
      class="scene scene--dashboard-vivid"
      aria-label="Dashboard vivid fixture, __PAGE_VARIANT__ variant"
    >
      <p id="defect-summary" class="sr-only">__DEFECT_SUMMARY__</p>

      <h1 class="dv-title">Pulse</h1>
      <p class="dv-sub">KPI tiles with loud brand fills</p>

      <article class="dv-kpi dv-kpi--teal">
        <h2 class="dv-kpi-label">Signups</h2>
        <p class="dv-kpi-value dv-kpi-value--teal">2.4k</p>
      </article>
      <article class="dv-kpi dv-kpi--coral">
        <h2 class="dv-kpi-label">Revenue</h2>
        <p class="dv-kpi-value dv-kpi-value--coral">$81k</p>
      </article>
      <article class="dv-kpi dv-kpi--amber">
        <h2 class="dv-kpi-label">Churn</h2>
        <p class="dv-kpi-value dv-kpi-value--amber">1.8%</p>
      </article>
      <article class="dv-kpi dv-kpi--violet">
        <h2 class="dv-kpi-label">NPS</h2>
        <p class="dv-kpi-value dv-kpi-value--violet">64</p>
      </article>

      <div class="dv-chart" aria-label="Chart placeholder">
        <span class="dv-chart-label">Weekly trend</span>
        <div class="dv-bar dv-bar--1"></div>
        <div class="dv-bar dv-bar--2"></div>
        <div class="dv-bar dv-bar--3"></div>
        <div class="dv-bar dv-bar--4"></div>
        <div class="dv-bar dv-bar--5"></div>
      </div>
    </main>
  </body>
</html>
