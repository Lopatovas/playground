<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bulwark · Food delivery</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
    <link rel="stylesheet" href="/fixtures.css" />
  </head>
  <body class="page-food-delivery __PAGE_CLASSES__">
    <main
      class="scene scene--food-delivery"
      aria-label="Food delivery fixture, __PAGE_VARIANT__ variant"
    >
      <p id="defect-summary" class="sr-only">__DEFECT_SUMMARY__</p>

      <div class="fd-status">9:41</div>
      <h1 class="fd-title">Dinner near you</h1>
      <a class="fd-chip fd-chip--active" href="#all">All</a>
      <a class="fd-chip fd-chip--2" href="#pizza">Pizza</a>
      <a class="fd-chip fd-chip--3" href="#sushi">Sushi</a>

      <article class="fd-row fd-row--1">
        <div class="fd-thumb fd-thumb--1"></div>
        <h2 class="fd-name">Noon Oven</h2>
        <p class="fd-meta">25–35 min · $</p>
        <span class="fd-tag">20% off</span>
      </article>
      <article class="fd-row fd-row--2">
        <div class="fd-thumb fd-thumb--2"></div>
        <h2 class="fd-name">Harbor Roll</h2>
        <p class="fd-meta">30–40 min · $$</p>
        <span class="fd-tag fd-tag--free">Free delivery</span>
      </article>
      <article class="fd-row fd-row--3">
        <div class="fd-thumb fd-thumb--3"></div>
        <h2 class="fd-name">Green Bowl</h2>
        <p class="fd-meta">15–25 min · $</p>
      </article>

      <a class="fd-cart" href="#cart">View cart · $24</a>
    </main>
  </body>
</html>
