<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bulwark · Marketplace</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
    <link rel="stylesheet" href="/fixtures.css" />
  </head>
  <body class="page-marketplace __PAGE_CLASSES__">
    <main class="scene scene--marketplace" aria-label="Marketplace fixture, __PAGE_VARIANT__ variant">
      <p id="defect-summary" class="sr-only">__DEFECT_SUMMARY__</p>

      <div class="mp-top">
        <span class="mp-brand">Bazaar</span>
        <a class="mp-search" href="#search">Search listings</a>
      </div>

      <article class="mp-card mp-card--1">
        <div class="mp-img mp-img--1"></div>
        <span class="mp-badge mp-badge--deal">Deal</span>
        <h2 class="mp-name">Oak desk</h2>
        <p class="mp-price mp-price--1">$240</p>
      </article>
      <article class="mp-card mp-card--2">
        <div class="mp-img mp-img--2"></div>
        <span class="mp-badge mp-badge--new">New</span>
        <h2 class="mp-name">Clay lamp</h2>
        <p class="mp-price mp-price--2">$64</p>
      </article>
      <article class="mp-card mp-card--3">
        <div class="mp-img mp-img--3"></div>
        <span class="mp-badge mp-badge--deal">Deal</span>
        <h2 class="mp-name">Wool throw</h2>
        <p class="mp-price mp-price--3">$88</p>
      </article>
      <article class="mp-card mp-card--4">
        <div class="mp-img mp-img--4"></div>
        <h2 class="mp-name">Stone vase</h2>
        <p class="mp-price mp-price--4">$42</p>
      </article>

      <a class="mp-cta" href="#all">See all deals</a>
    </main>
  </body>
</html>
