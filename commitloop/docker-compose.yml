services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: commitloop
      POSTGRES_PASSWORD: commitloop
      POSTGRES_DB: commitloop
    ports:
      - "5432:5432"
    volumes:
      - commitloop_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U commitloop -d commitloop"]
      interval: 5s
      timeout: 5s
      retries: 5

  postgres-test:
    image: postgres:16-alpine
    profiles: ["test"]
    environment:
      POSTGRES_USER: commitloop
      POSTGRES_PASSWORD: commitloop
      POSTGRES_DB: commitloop_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U commitloop -d commitloop_test"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  commitloop_pg:
