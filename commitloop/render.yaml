# Render Blueprint — API + Postgres. Docs: DEPLOY.md
#
# Sync in Render: New → Blueprint → repo Lopatovas/commitloop → render.yaml
# Put API + DB in the same region (Frankfurt) for private networking.

databases:
  - name: commitloopdb
    plan: free
    region: frankfurt
    databaseName: commitloopdb
    user: commitmaster

services:
  - type: web
    name: commitloop-api
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci --include=dev && npm run build:render -w @commitloop/api
    startCommand: npm run start -w @commitloop/api
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: commitloopdb
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: WEB_URL
        value: https://commitloop.dev
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: GITHUB_CALLBACK_URL
        value: https://api.commitloop.dev/auth/github/callback
      - key: MENTOR_GITHUB_IDS
        sync: false
