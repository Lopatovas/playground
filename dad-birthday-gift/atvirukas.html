<!DOCTYPE html>
<html lang="lt">
<head>
  <meta charset="UTF-8">
  <title>Spalvingas atvirukas (ankstesnis variantas)</title>
  <style>
    @page { size: A4; margin: 12mm; }
    @media print { body { margin: 0; } }
    body { font-family: system-ui, sans-serif; }
    .page { width: 210mm; min-height: 297mm; margin: 0 auto; padding: 10mm; background: linear-gradient(160deg, #ff6b35, #00a8e8); }
    .postcard { background: #fff; border-radius: 20px; min-height: calc(297mm - 20mm); padding: 28px 32px; }
    h2 { font-size: 2.4rem; color: #007ea7; margin: 0 0 8px; }
    .lead { font-size: 1.15rem; color: #444; }
    .box { border: 2px solid #ff6b35; border-radius: 12px; padding: 20px; margin: 20px 0; background: #fffaf5; }
  </style>
</head>
<body>
  <div class="page">
    <div class="postcard">
      <h2>Kelionė į Turkiją</h2>
      <p class="lead">Tėti, su 50-uoju gimtadieniu dovanojame <strong>all inclusive</strong> atostogas Turkijoje.</p>
      <div class="box"><p>Datos — tavo pasirinkimas (forma kitame lape).</p></div>
      <p><strong>Tavo šeima</strong></p>
    </div>
  </div>
</body>
</html>
