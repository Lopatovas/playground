services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: readiness
      POSTGRES_PASSWORD: readiness
      POSTGRES_DB: readiness
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U readiness -d readiness"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: sh -c "npm run prisma:db:push -w @ai-readiness/api && npm run start -w @ai-readiness/api"
    environment:
      NODE_ENV: production
      PORT: 3000
      WEB_ORIGIN: http://localhost:8080
      DATABASE_URL: postgresql://readiness:readiness@postgres:5432/readiness?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      BULL_BOARD_PATH: /queues
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      MISTRAL_MODEL: ${MISTRAL_MODEL:-mistral-small-latest}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "3000:3000"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:3000
    depends_on:
      - api
    ports:
      - "8080:80"

volumes:
  postgres-data:
