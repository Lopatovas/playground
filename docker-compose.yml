version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: competitor_intel
      POSTGRES_PASSWORD: competitor_intel_pass
      POSTGRES_DB: competitor_intel
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U competitor_intel']
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5

  searxng:
    image: searxng/searxng:latest
    ports:
      - '8888:8080'
    environment:
      - SEARXNG_BASE_URL=http://localhost:8888
    volumes:
      - ./searxng-settings.yml:/etc/searxng/settings.yml:ro

volumes:
  pgdata:
